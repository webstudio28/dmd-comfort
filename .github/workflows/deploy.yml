name: "Deploy to cPanel"
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Deploy

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build CSS
        run: npm run css:build
      - name: Build
        run: npm run build

      - name: Ensure cPanel secrets present
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          if [ -z "$CPANEL_HOST" ] || [ -z "$CPANEL_USER" ] || [ -z "$CPANEL_PASS" ]; then
            echo "One or more required secrets (CPANEL_HOST, CPANEL_USER, CPANEL_PASS) are missing." >&2
            exit 1
          fi

      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          protocol: ${{ secrets.CPANEL_PROTOCOL || 'ftp' }}
          port: ${{ secrets.CPANEL_PORT || 21 }}
          server: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PASS }}
          local-dir: _site/
          server-dir: ${{ secrets.CPANEL_SERVER_DIR || 'dmd-comfort/' }}
          dangerous-clean-slate: false
          log-level: verbose

      - name: Purge LiteSpeed cache and confirm the live form
        run: |
          curl -fsS "https://dmdkomfort.bg/purge-cache.php" || true
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://dmdkomfort.bg/kontakti/?deploy=${GITHUB_SHA}" | grep -q 'name="email"'; then
              echo "Live contact form includes the email field."
              exit 0
            fi
            sleep 10
          done
          echo "Live site is still serving the contact form without an email field." >&2
          exit 1
